services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=128M
    environment:
      MYSQL_DATABASE: flarum
      MYSQL_USER: flarum
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uflarum", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  app:
    image: us-central1-docker.pkg.dev/graphite-ally-445108-k3/flarum/flarum:latest
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: flarum
      DB_USERNAME: flarum
      DB_PASSWORD: ${MYSQL_PASSWORD}
      FLARUM_URL: ${FLARUM_URL}
      FLARUM_FORUM_TITLE: ${FLARUM_FORUM_TITLE:-Flarum Forum}
      FLARUM_ADMIN_USER: ${FLARUM_ADMIN_USER:-admin}
      FLARUM_ADMIN_PASSWORD: ${FLARUM_ADMIN_PASSWORD:-admin-password-123}
      FLARUM_ADMIN_EMAIL: ${FLARUM_ADMIN_EMAIL:-admin@example.com}
    volumes:
      - app-www:/var/www/html
      - flarum-config:/flarum-config
      - flarum-storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - app-www:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  app-www:
  flarum-config:
  flarum-storage:
  mysql-data:
